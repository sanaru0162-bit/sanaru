<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>季節講座 提案書システム v11</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f4f7fb;color:#172033;font-size:13px}main{max-width:820px;margin:auto;padding:9px 10px 82px}.hero{padding:14px 16px;border-radius:16px;margin-bottom:10px;background:linear-gradient(135deg,#fff0a0,#70d5f4 58%,#16a2d5)}.winter{background:linear-gradient(135deg,#eef9ff,#c6dcf4 55%,#7899c8)}.hero h1{font-size:20px;margin:0 0 3px}.hero h2{font-size:19px;margin:0 0 3px}.hero p{font-size:12px;margin:0}h2{font-size:17px;margin:13px 0 7px}.choice,.card,.action{width:100%;border:0;border-radius:11px;background:#fff;box-shadow:0 3px 12px #0001;padding:9px 11px;margin:4px 0;text-align:left;font-size:13px}.action{text-align:center;background:#1f5fd1;color:#fff;font-weight:800}.secondary{color:#1f5fd1;border:1px solid #b8c8eb}.selected{outline:2px solid #2466d5;background:#eef5ff}.subject{margin-top:12px}.subject h3{font-size:15px;margin:0 0 4px;border-left:4px solid #3c73d8;padding-left:6px}.title{font-size:14px;font-weight:800}.badges{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}.badge{padding:3px 6px;border-radius:999px;background:#edf2fb;font-size:10px;font-weight:700}.reco{background:#fff2cf}.breakdown{font-size:11.5px;line-height:1.45;margin-top:4px}.desc{font-size:12px;line-height:1.45;margin:5px 0}.price{font-size:15px;font-weight:850;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}.stat{background:#fff;border-radius:10px;padding:6px 4px;text-align:center}.stat small{font-size:10px;color:#667085}.stat b{display:block;font-size:14px}.hide{display:none}.note{font-size:10.5px;color:#697386;line-height:1.45}.special{background:#fff8df;border:1px solid #f1df9f;border-radius:10px;padding:9px;font-size:11px;white-space:pre-line}.sticky{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;border-top:1px solid #dce3ee;padding:5px 8px calc(5px + env(safe-area-inset-bottom));z-index:10}.sticky-inner{max-width:820px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}.sticky-summary{font-size:10px}.sticky-price{font-size:15px;font-weight:900;color:#174dba}.checklist{list-style:none;padding:0}.checklist li{padding:5px 0;border-bottom:1px solid #e5e9f0;font-size:12px}.toolbar{display:flex;gap:5px;flex-wrap:wrap}.toolbar button{flex:1;min-width:110px}@media print{.no-print,.sticky{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}</style></head><body><main><div id="hero" class="hero"><h1>中3 季節講座 提案書システム</h1><p>面談しながらプランを比較・選択</p></div><section id="s1"><h2>講座選択</h2><button class="choice" onclick="season('夏期')">☀️ 夏期講座</button><button class="choice" onclick="season('冬期')">❄️ 冬期講座</button></section><section id="s2" class="hide"><h2>冬期｜受験区分</h2><button class="choice" onclick="exam('推薦入試用')">🎓 推薦入試用</button><button class="choice" onclick="exam('一般受験用')">📝 一般受験用</button></section><section id="s3" class="hide"><h2 id="heading"></h2><p class="note">同一教科は1プランのみ。別プランをタップすると自動で切り替わります。</p><div id="plans"></div><div class="stats"><div class="stat"><small>総回数</small><b id="rc">0回</b></div><div class="stat"><small>総時間</small><b id="hr">0時間</b></div><div class="stat"><small>料金合計</small><b id="pr">0円</b></div></div><button class="action" onclick="proposal()">提案書を確認</button></section><section id="s4" class="hide"><div id="phero" class="hero"><h2 id="pt"></h2></div><div class="toolbar no-print"><button class="action" onclick="window.print()">🖨️ 印刷</button><button class="choice secondary" onclick="handover()">📋 引継ぎシート</button></div><div class="stats"><div class="stat"><small>総回数</small><b id="pc"></b></div><div class="stat"><small>総時間</small><b id="pht"></b></div><div class="stat"><small>料金合計</small><b id="pp"></b></div></div><div id="plist"></div><h2>特記事項</h2><div id="notes" class="special"></div></section><section id="s5" class="hide"><div id="hhero" class="hero"><h2>引継ぎシート</h2></div><button class="action no-print" onclick="window.print()">🖨️ 印刷</button><div id="hlist"></div></section></main><div id="sticky" class="sticky hide no-print"><div class="sticky-inner"><div id="st" class="sticky-summary">未選択</div><div id="sp" class="sticky-price">0円</div></div></div><script>const U={映像授業:1320,個別指導:2640,AI学トレ:880,自立学習:1650},O=['英語','数学','理科','社会','国語'];const D=[['英語','補強','偏差値40前後',{映像授業:10,個別指導:10,自立学習:16},'基礎・弱点を補強し、2学期の得点力向上を目指します。',['フォレスタステップ','スピードチェック'],'私立推薦希望生徒推奨'],['英語','強化','偏差値50前後',{映像授業:10,個別指導:10,AI学トレ:20},'標準〜入試レベルの実力を強化します。',['夏期講座テキスト','テーマ別入試対策ⅠⅡ'],''],['数学','補強','偏差値40前後',{個別指導:10,AI学トレ:10,自立学習:10},'基本事項と弱点単元を重点的に補強します。',['パーソナル中3'],'私立推薦希望生徒推奨'],['数学','強化','偏差値50前後',{映像授業:10,個別指導:20},'標準〜入試問題まで段階的に演習します。',['夏期講座テキスト','テーマ別入試対策ⅠⅡ'],''],['理科','補強','偏差値40前後',{映像授業:12,AI学トレ:12,自立学習:12},'中1・中2範囲を中心に基礎を復習します。',['中1理科 年間用','中2理科 年間用'],''],['社会','強化','偏差値50前後',{映像授業:30,自立学習:10},'地理・歴史を中心に入試対策を進めます。',['社会年間用教材'],''],['国語','強化','偏差値50前後',{映像授業:10,AI学トレ:20,自立学習:10},'読解と知識を組み合わせて入試力を高めます。',['スピードチェック','テーマ別入試対策ⅠⅡ'],'']];let S='',E='',Q={};const y=n=>n.toLocaleString()+'円',r=c=>Object.values(c).reduce((a,b)=>a+b,0),c=x=>Object.entries(x).reduce((a,[k,v])=>a+(U[k]||0)*v,0);function season(x){S=x;s1.classList.add('hide');hero.className='hero '+(x==='冬期'?'winter':'');if(x==='冬期')s2.classList.remove('hide');else{E='一般受験用';show()}}function exam(x){E=x;s2.classList.add('hide');show()}function show(){s3.classList.remove('hide');sticky.classList.remove('hide');heading.textContent=S+'講座 '+(S==='冬期'?E:'')+' プラン選択';draw()}function draw(){let z='';O.forEach(sub=>{let rows=D.map((x,i)=>({x,i})).filter(o=>o.x[0]===sub);if(!rows.length)return;z+=`<div class=subject><h3>${sub}</h3>`;rows.forEach(({x,i})=>z+=`<button class="card ${Q[sub]===i?'selected':''}" onclick="tog(${i})"><div class=title>${Q[sub]===i?'✓ ':''}${x[1]}</div><div class=badges><span class=badge>${x[2]}</span>${x[6]?`<span class="badge reco">${x[6]}</span>`:''}</div><div class=breakdown>${Object.entries(x[3]).map(([k,v])=>k+' '+v+'回').join(' ／ ')}</div><p class=desc>${x[4]}</p><div class=price>${y(c(x[3]))}</div></button>`);z+='</div>'});plans.innerHTML=z;sum()}function tog(i){let sub=D[i][0];Q[sub]===i?delete Q[sub]:Q[sub]=i;draw()}function chosen(){return Object.values(Q).map(i=>D[i])}function sum(){let a=chosen(),n=a.reduce((s,x)=>s+r(x[3]),0),p=a.reduce((s,x)=>s+c(x[3]),0);rc.textContent=n+'回';hr.textContent=n+'時間';pr.textContent=y(p);st.textContent=a.length?a.map(x=>x[0]+'：'+x[1]).join(' ／ ')+'｜'+n+'回':'未選択';sp.textContent=y(p)}function proposal(){let a=chosen(),n=a.reduce((s,x)=>s+r(x[3]),0),p=a.reduce((s,x)=>s+c(x[3]),0);s3.classList.add('hide');s4.classList.remove('hide');sticky.classList.add('hide');phero.className='hero '+(S==='冬期'?'winter':'');pt.textContent=S+'講座 '+(S==='冬期'?E+' ':'')+'ご提案書';pc.textContent=n+'回';pht.textContent=n+'時間';pp.textContent=y(p);plist.innerHTML=a.map(x=>`<div class=card><b>${x[0]}｜${x[1]}</b><div class=badges><span class=badge>${x[2]}</span></div><p class=desc>${x[4]}</p><div class=breakdown>${Object.entries(x[3]).map(([k,v])=>k+' '+v+'回 × '+y(U[k])).join('<br>')}</div><div class=price>${y(c(x[3]))}</div></div>`).join('');notes.textContent='教材費は別途になる場合があります。\n受講費は講座期間終了後、毎月の授業料と同時に請求します。\n条件により映像授業・AI学トレに正規料金が適用される場合があります。'}function handover(){s4.classList.add('hide');s5.classList.remove('hide');hhero.className='hero '+(S==='冬期'?'winter':'');hlist.innerHTML=chosen().map(x=>`<div class=card><b>${x[0]}｜${x[1]}</b><p class=desc>${x[4]}</p><b>教材発注・確認</b><ul class=checklist>${x[5].map(m=>'<li>□ '+m+'</li>').join('')}</ul></div>`).join('')}</script></body></html>
