<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>冬期講座 案内紙面作成</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#eef4f8;color:#16324a}.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}.panel{padding:22px;background:#fff;border-right:1px solid #d7e1e8}.panel h1{font-size:20px;margin:0 0 18px}.group{margin:18px 0}.group label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}.group input,.group select,.group textarea{width:100%;padding:9px;border:1px solid #b9c9d5;border-radius:7px;background:#fff}.btn{width:100%;padding:10px;border:0;border-radius:8px;background:#1769aa;color:white;font-weight:700;cursor:pointer}.status{font-size:12px;margin-top:8px;color:#5d7282}.stage{padding:24px;overflow:auto}.paper{position:relative;width:1123px;height:794px;margin:auto;background:linear-gradient(#e9f8ff 0 7%,#fff 7% 92%,#e9f8ff 92%);box-shadow:0 5px 25px #7893a855;border:1px solid #b8d6e8;overflow:hidden}.paper:before,.paper:after{content:"❄";position:absolute;color:#9ed8f4;font-size:55px}.paper:before{left:20px;top:20px}.paper:after{right:30px;bottom:15px}.brand{position:absolute;left:50px;top:26px;font-weight:800}.title{position:absolute;left:0;right:0;top:24px;text-align:center;font-size:34px;font-weight:900;color:#12649b}.catch{position:absolute;right:55px;top:38px;font-weight:800}.content{position:absolute;left:55px;right:55px;top:105px;bottom:125px;display:flex;flex-direction:column}.tableWrap{flex:1;min-height:0;overflow:hidden}.plans{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--fs,12px)}.plans th,.plans td{border:1px solid #486d86;padding:5px 6px;text-align:center;vertical-align:middle;line-height:1.25}.plans th{background:#d8edf8;font-weight:800}.plans td.course{text-align:left;font-weight:700}.notes{position:absolute;left:55px;right:55px;bottom:34px;height:75px;border:2px solid #4c7893;padding:8px 12px;font-size:11px}.notes b{display:block;margin-bottom:3px}.toolbar{display:flex;gap:8px;margin-top:16px}.toolbar button{flex:1}.warn{color:#b45309}.ok{color:#15803d}@media(max-width:900px){.app{display:block}.panel{border-right:0}.stage{padding:8px}.paper{transform-origin:top left}}@media print{body{background:#fff}.panel{display:none}.stage{padding:0}.paper{box-shadow:none;border:0;width:297mm;height:210mm}@page{size:A4 landscape;margin:0}}
</style></head><body><div class="app"><aside class="panel"><h1>冬期講座 案内作成</h1>
<div class="group"><label>Apps Script 公開URL</label><input id="api" placeholder="https://script.google.com/macros/s/.../exec"><div class="status">季節講座提案システムと同じJSONP方式で取得します。</div></div>
<div class="group"><label>地域</label><select id="region"><option value="owari">愛知・尾張</option><option value="mikawa_with">愛知・三河（個別指導あり）</option><option value="mikawa_without">愛知・三河（個別指導なし）</option><option value="shizuoka">静岡</option></select></div>
<button class="btn" id="load">最新データを取得</button><div id="status" class="status">未接続</div>
<div class="group"><label>掲載する学年</label><select id="grade"><option value="">すべて</option><option>小4</option><option>小5</option><option>小6</option></select></div>
<div class="group"><label>表の見出し</label><input id="heading" value="冬期講座 おすすめプラン"></div>
<div class="group"><label>追加の注意事項</label><textarea id="extra" rows="4"></textarea></div>
<div class="toolbar"><button class="btn" onclick="window.print()">印刷・PDF保存</button></div>
</aside><main class="stage"><section class="paper" id="paper"><div class="brand">さなる個別 @will</div><div class="title">冬期講座</div><div class="catch">「できる！」がふえる冬に。</div>
<div class="content"><h2 id="paperHeading" style="text-align:center;margin:0 0 8px;font-size:18px">冬期講座 おすすめプラン</h2><div class="tableWrap"><table class="plans" id="plans"><thead><tr><th style="width:8%">学年</th><th style="width:18%">プラン</th><th style="width:10%">教科</th><th>受講内容</th><th style="width:14%">受講料</th></tr></thead><tbody></tbody></table></div></div>
<div class="notes"><b>注意事項</b><span id="notes"></span></div></section></main></div>
<script>
const SAMPLE={planRows:[[true,"愛知・尾張","小4","復習コース","算数",3,0,0,0,"復習コース","個別指導3回",1],[true,"愛知・尾張","小4","予習コース","算数",3,0,0,0,"予習コース","個別指導3回",2],[true,"愛知・尾張","小4","閃きの力","算数",0,0,4,0,"閃きの力","4回",3],[true,"愛知・尾張","小4","読書の力","国語",0,0,4,0,"読書の力","4回",4],[true,"愛知・尾張","小5","復習コース","算数",3,0,0,0,"復習コース","個別指導3回",5],[true,"愛知・尾張","小5","予習コース","算数",3,0,0,0,"予習コース","個別指導3回",6],[true,"愛知・尾張","小5","閃きの力","算数",0,0,4,0,"閃きの力","4回",7],[true,"愛知・尾張","小5","読書の力","国語",0,0,4,0,"読書の力","4回",8],[true,"愛知・尾張","小6","復習コース","算数",3,0,0,0,"復習コース","個別指導3回",9],[true,"愛知・尾張","小6","予習コース","算数",3,0,0,0,"予習コース","個別指導3回",10],[true,"愛知・尾張","小6","閃きの力","算数",0,0,4,0,"閃きの力","4回",11],[true,"愛知・尾張","小6","読書の力","国語",0,0,4,0,"読書の力","4回",12]],noteRows:[[true,"愛知・尾張",1,"教材費など別途費用がある場合があります。"]],unitRows:[[true,"個別指導",2640,1],[true,"AI学トレ",880,2],[true,"力シリーズ",0,3],[true,"映像授業",1320,4]]};let DATA=SAMPLE;
const regionLabel={owari:"愛知・尾張",mikawa_with:"愛知・三河（個別指導あり）",mikawa_without:"愛知・三河（個別指導なし）",shizuoka:"静岡"};
function yen(n){return new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(n)}
function render(){const grade=document.querySelector("#grade").value, label=regionLabel[region.value], units={};DATA.unitRows.filter(r=>r[0]).forEach(r=>units[r[1]]=Number(r[2])||0);const rows=DATA.planRows.filter(r=>r[0]&&(!r[1]||r[1]===label)&&(!grade||r[2]===grade)).sort((a,b)=>(a[11]||0)-(b[11]||0));const body=document.querySelector("#plans tbody");body.innerHTML=rows.map(r=>{const detail=[["個別指導",r[5]],["AI学トレ",r[6]],["力シリーズ",r[7]],["映像授業",r[8]]].filter(x=>Number(x[1])>0).map(x=>x[0]+" "+x[1]+"回").join(" ＋ ");const price=(Number(r[5])||0)*(units["個別指導"]||0)+(Number(r[6])||0)*(units["AI学トレ"]||0)+(Number(r[7])||0)*(units["力シリーズ"]||0)+(Number(r[8])||0)*(units["映像授業"]||0);return '<tr><td>'+r[2]+'</td><td class="course">'+r[3]+'</td><td>'+r[4]+'</td><td>'+detail+(r[10]?"<br><small>"+r[10]+"</small>":"")+'</td><td>'+yen(price)+'</td></tr>'}).join("");paperHeading.textContent=heading.value||"冬期講座 おすすめプラン";const ns=DATA.noteRows.filter(r=>r[0]&&(!r[1]||r[1]===label)).sort((a,b)=>a[2]-b[2]).map(r=>r[3]);if(extra.value.trim())ns.push(extra.value.trim());notes.textContent=ns.join("　／　");fit()}
function fit(){const table=document.querySelector("#plans"),wrap=document.querySelector(".tableWrap");let fs=13;table.style.setProperty("--fs",fs+"px");while(table.scrollHeight>wrap.clientHeight&&fs>8.5){fs-=.25;table.style.setProperty("--fs",fs+"px")}status.className="status "+(table.scrollHeight<=wrap.clientHeight?"ok":"warn");status.textContent=table.scrollHeight<=wrap.clientHeight?"全項目が収まっています（本文 "+fs.toFixed(1)+" px）":"紙面に収まりません。学年を絞ってください。"}
function loadApi(){const base=api.value.trim();if(!base){status.textContent="Apps Script URLを入力してください";return}status.textContent="取得中…";const cb="winterCb_"+Date.now();window[cb]=d=>{delete window[cb];script.remove();if(!d||!d.ok){status.textContent="取得失敗: "+(d&&d.error||"不明");return}DATA=d;status.textContent="取得完了 "+new Date().toLocaleTimeString();render()};const script=document.createElement("script");script.onerror=()=>{status.textContent="取得失敗";delete window[cb]};script.src=base+(base.includes("?")?"&":"?")+"region="+encodeURIComponent(region.value)+"&callback="+cb;document.body.appendChild(script)}
load.onclick=loadApi;[grade,region,heading,extra].forEach(el=>el.addEventListener("input",render));window.addEventListener("resize",()=>{const p=document.querySelector(".paper"),s=document.querySelector(".stage");if(innerWidth<900)p.style.transform="scale("+Math.min(1,(s.clientWidth-16)/1123)+")";else p.style.transform="";fit()});render();setInterval(()=>{if(api.value.trim())loadApi()},60000);
</script></body></html>
