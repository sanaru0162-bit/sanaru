<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>季節講座 提案書システム</title><style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f4f7fb;color:#082e6b}*{box-sizing:border-box}.wrap{min-height:100%;display:grid;place-items:center;padding:24px}.card{width:min(900px,100%);background:#fff;border:1px solid #dfe8f2;border-radius:22px;padding:34px;box-shadow:0 20px 60px #12345a12}.ey{font-size:11px;font-weight:900;color:#1767d8;letter-spacing:.12em}.card h1{margin:7px 0 8px;font-size:30px}.card p{color:#718198}.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.opt{border:1px solid #dbe6f2;background:#fff;border-radius:16px;padding:22px;text-align:left;cursor:pointer;box-shadow:0 7px 20px #16375f0a}.opt b{font-size:18px;color:#082e6b}.opt span{display:block;margin-top:5px;color:#718198;font-size:11px}.app{display:none;min-height:100vh;grid-template-columns:335px 1fr;background:#fff}.side{padding:23px;background:#f9fbfe;border-right:1px solid #e1e8f1}.side h2{font-size:19px;margin:0}.side p{font-size:10px;color:#657896}.back{border:1px solid #dce5ef;background:#fff;border-radius:18px;padding:7px 14px;color:#214a82;font-weight:800;cursor:pointer}.label{font-size:12px;font-weight:900;margin:20px 0 8px}.plan{width:100%;padding:11px;margin:4px 0;border:1px solid #dfe7f1;background:#fff;border-radius:8px;text-align:left;cursor:pointer}.plan.on{border:2px solid #2b78e5;background:#f3f8ff}.sum{margin-top:18px;border:1px solid #dfe7f1;border-radius:9px;padding:12px;background:#fff}.sum div{display:flex;justify-content:space-between;font-size:11px;margin:4px 0}.main{background:#fff;overflow:auto}.hero{height:365px;background:linear-gradient(135deg,#d8f1ff,#fff6cf 55%,#d8f4ff);display:grid;place-items:center;text-align:center}.hero em{font:italic 25px Georgia,serif;color:#d99a00}.hero h1{font-family:"Yu Mincho",serif;font-size:45px;margin:4px;color:#082e6b}.hero small{font-family:"Yu Mincho",serif}.body{padding:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{height:48px;border-radius:7px;font-weight:900;cursor:pointer}.primary{border:0;background:#0c55c5;color:#fff}.secondary{border:1px solid #cbd9ea;background:#fff;color:#0a397c}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #e1e8f0;border-radius:9px;margin-top:10px;overflow:hidden}.metric{text-align:center;padding:17px;border-right:1px solid #e1e8f0}.metric:last-child{border:0}.metric small{font-weight:900}.metric b{display:block;font-size:27px;margin-top:5px}.metric.gold b{color:#a77713}.courses{margin-top:14px}.course{border:1px solid #dfe7f1;border-radius:10px;margin-bottom:12px;padding:20px;box-shadow:0 4px 14px #12345a0b}.course h3{margin:0 0 8px}.course p{font-size:11px}.price{font-size:22px;font-weight:900;color:#075ed7}.empty{text-align:center;padding:30px;border:1px dashed #ccd8e6;border-radius:10px;color:#75869e}@media(max-width:900px){.opts{grid-template-columns:1fr}.app{grid-template-columns:1fr}.hero{height:230px}.hero h1{font-size:28px}}@media print{.side,.actions{display:none}.app{display:block!important}}</style></head><body><div id="start" class="wrap"><div class="card"><div class="ey">STEP 01</div><h1>中3 季節講座 提案書システム</h1><p>面談する講座を選択してください。</p><div class="opts"><button class="opt" onclick="openApp('夏期')"><b>☀ 夏期講座</b><span>夏期講座のプランを提案</span></button><button class="opt" onclick="openApp('冬期')"><b>❄ 冬期講座</b><span>冬期講座のプランを提案</span></button></div></div></div><div id="app" class="app"><aside class="side"><h2>季節講座 提案書システム</h2><p>面談しながらプランを比較・選択</p><button class="back" onclick="goBack()">← 戻る</button><div class="label">プランを選択</div><div id="plans"></div><div class="sum"><div><span>総回数</span><b id="sc">0回</b></div><div><span>総時間</span><b id="sh">0時間</b></div><div><span>料金合計</span><b id="sp">0円</b></div></div></aside><main class="main"><div class="hero"><div><em id="en">Summer Course</em><h1 id="ttl">夏期講座 ご提案書</h1><small id="sub">この夏、確かな一歩を。</small></div></div><div class="body"><div class="actions"><button class="action primary" onclick="print()">▣ 印刷</button><button class="action secondary" onclick="alert('引継ぎシートは選択プランの教材発注チェックを出力します')">▤ 引継ぎシート</button></div><div class="metrics"><div class="metric"><small>総回数</small><b id="mc">0回</b></div><div class="metric"><small>総時間</small><b id="mh">0時間</b></div><div class="metric gold"><small>料金合計</small><b id="mp">0円</b></div></div><div id="courses" class="courses"><div class="empty">左側からプランを選択してください。</div></div></div></main></div><script>const data=[['英語','補強',36,42240,'基礎・弱点を補強し、得点力向上を目指します。'],['英語','強化',40,57200,'標準〜入試レベルの実力を強化します。'],['数学','補強',30,51700,'基本事項と弱点単元を重点的に補強します。'],['数学','強化',30,66000,'標準〜入試問題まで段階的に演習します。'],['国語','強化',40,39600,'読解と知識を組み合わせて入試力を高めます。'],['理科','補強',36,46200,'中1・中2範囲を中心に基礎を復習します。'],['社会','強化',40,56100,'地理・歴史を中心に入試対策を進めます。']];let season='',sel={};function openApp(s){season=s;document.getElementById('start').style.display='none';document.getElementById('app').style.display='grid';document.getElementById('en').textContent=s==='夏期'?'Summer Course':'Winter Course';document.getElementById('ttl').textContent=s+'講座 ご提案書';document.getElementById('sub').textContent=s==='夏期'?'この夏、確かな一歩を。':'この冬、志望校へ近づく一歩を。';render()}function goBack(){document.getElementById('app').style.display='none';document.getElementById('start').style.display='grid';sel={}}function render(){let h='';data.forEach((x,i)=>h+=`<button class="plan ${sel[x[0]]===i?'on':''}" onclick="pick(${i})"><b>${x[0]}｜${x[1]}</b><br><small>${x[2]}回・${x[2]}時間</small></button>`);document.getElementById('plans').innerHTML=h;update()}function pick(i){let x=data[i];sel[x[0]]===i?delete sel[x[0]]:sel[x[0]]=i;render()}function update(){let a=Object.values(sel).map(i=>data[i]),n=a.reduce((s,x)=>s+x[2],0),p=a.reduce((s,x)=>s+x[3],0),y=p.toLocaleString()+'円';['sc','mc'].forEach(id=>document.getElementById(id).textContent=n+'回');['sh','mh'].forEach(id=>document.getElementById(id).textContent=n+'時間');['sp','mp'].forEach(id=>document.getElementById(id).textContent=y);document.getElementById('courses').innerHTML=a.length?a.map(x=>`<article class="course"><h3>${x[0]}｜${x[1]}</h3><p>${x[4]}</p><div>${x[2]}回・${x[2]}時間</div><div class="price">${x[3].toLocaleString()}円</div></article>`).join(''):'<div class="empty">左側からプランを選択してください。</div>'}</script></body></html>
