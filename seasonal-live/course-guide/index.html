<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>季節講座 案内作成</title>
  <meta name="description" content="季節・地域版・学年を選び、季節講座の案内紙面を作成します。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230054a6'/%3E%3Cpath d='M8 7h12l5 5v13H8z' fill='white'/%3E%3Cpath d='M12 16h9M12 20h9' stroke='%230054a6' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <script defer src="data.js"></script><script defer src="app.js"></script>
</head>
<body>
  <header class="topbar"><span class="brand">さなる個別@will</span><h1>季節講座 案内作成</h1><span class="demo-badge">デモ版</span></header>
  <main class="workspace">
    <aside class="panel" aria-label="紙面の設定">
      <div class="field"><label for="season">1　季節</label><select id="season"><option value="winter">冬期</option><option value="summer">夏期（準備中）</option><option value="spring">春期（準備中）</option></select></div>
      <div class="field"><label for="region">2　地域版</label><select id="region"><option value="owari">愛知・尾張</option><option value="mikawa_with">愛知・三河（個別指導あり）</option><option value="mikawa_without">愛知・三河（個別指導なし）</option><option value="shizuoka">静岡</option></select></div>
      <fieldset class="field"><legend>3　学年</legend><p class="hint">同じ学校段階の学年を複数選べます。</p><div id="grades"></div><p id="grade-help" class="hint">小4〜小6の紙面を確認できます。</p></fieldset>
      <button id="print" class="primary" disabled>印刷・PDF保存</button>
      <p class="hint">印刷画面で「PDFに保存」を選択してください。用紙はA4・横向きです。</p>
      <div class="source-info"><b>データについて</b><p id="source-info"></p><p>シートの変更を自動反映する接続は準備中です。</p><a href="https://docs.google.com/spreadsheets/d/1j63jxMDg5L09a4Gncnq7gowv8SXtjbIoJe52tC-67k8/edit" target="_blank" rel="noopener">プランマスターを開く</a></div>
    </aside>
    <section class="preview" aria-label="案内紙面のプレビュー">
      <div class="preview-heading"><h2>紙面プレビュー</h2><span id="summary"></span></div>
      <p id="status" role="status" aria-live="polite">紙面を準備しています。</p>
      <div id="empty" class="empty" hidden></div>
      <div id="paper-frame" class="paper-frame" hidden><article id="paper" class="paper" aria-label="A4横向きの案内紙面">
        <img id="background" class="background" src="assets/winter-elementary.png" alt="冬期講座 小学生用の背景デザイン">
        <section class="content"><div class="paper-heading"><h2 id="paper-title">冬期講座 おすすめプラン</h2><span id="paper-meta"></span></div><div class="table-wrap"><table id="plans"><colgroup><col style="width:7%"><col style="width:19%"><col style="width:8%"><col style="width:44%"><col style="width:22%"></colgroup><thead><tr><th scope="col">学年</th><th scope="col">プラン</th><th scope="col">教科</th><th scope="col">受講内容</th><th scope="col">受講料（税込）</th></tr></thead><tbody></tbody></table></div></section>
        <section class="paper-notes" aria-label="注意事項"><ul id="notes"></ul></section>
      </article></div>
    </section>
  </main>
</body></html>
