idden><div class=box><button class=back id=examBack>← 戻る</button><div class=ey>STEP 02</div><h1>冬期講座の受験区分</h1><div class=opts><button class=opt data-exam=推薦入試用><b>推薦入試用</b><span>私立推薦対策を中心に提案</span></button><button class=opt data-exam=一般受験用><b>一般受験用</b><span>一般入試に向けた総合対策</span></button></div></div></section><section class=work id=work hidden><aside class=side><div class=sidehead><h2>面談・プラン選択</h2><button class=back id=workBack>← 戻る</button></div><div class=meta><div><small>講座</small><b id=mSeason></b></div><div><small>受験区分</small><b id=mExam></b></div></div><div id=planList></div><div class=sum><div><span>選択プラン</span><b id=sNum>0件</b></div><div><span>総回数</span><b id=sCount>0回</b></div><div><span>総時間</span><b id=sHours>0時間</b></div><div class=total><span>料金合計</span><b id=sPrice>0円</b></div></div><button class=confirm id=confirm>提案書を確認する</button></aside><main class=main><section class=pview id=pview><div class=paper><div class="hero summer" id=hero><div class=heroBox><em id=en>Summer Course</em><h2 id=title>夏期講座 ご提案書</h2><small id=sub>この夏、確かな一歩を。</small></div></div><div class=body><div class=acts><button class="act print" id=print>印刷する</button><button class="act handover" id=openH>引継ぎシートを開く</button></div><div class=metrics><div class=metric><small>総回数</small><b id=pCount>0回</b></div><div class=metric><small>総時間</small><b id=pHours>0時間</b></div><div class="metric gold"><small>料金合計</small><b id=pPrice>0円</b></div></div><div class=courses id=courses><div class=empty>左側からプランを選択すると、ここに提案内容が表示されます。</div></div><div class=special><b>特記事項</b><div class=note id=note></div></div></div></div></section><section class=hview id=hview><div class=sheet><div class=sheethead><h2>季節講座 引継ぎシート</h2><div class=hacts><button class="act handover" id=backP>提案書へ戻る</button> <button class="act print" id=printH>印刷する</button></div></div><div class=hcards id=hcards></div></div></section></main></section><div class=toast id=toast></div><script>const $=x=>document.getElementById(x),U={映像授業:1320,個別指導:2640,AI学トレ:880,自立学習:1650},O=['英語','数学','理科','社会','国語'],G=[['英語','補強','偏差値40前後',{映像授業:10,個別指導:10,自立学習:16},'基礎・弱点を補強し、得点力向上を目指します。',['フォレスタステップ','スピードチェック'],'私立推薦希望生徒推奨'],['英語','強化','偏差値50前後',{映像授業:10,個別指導:10,AI学トレ:20},'標準〜入試レベルの実力を強化します。',['夏期講座テキスト','テーマ別入試対策ⅠⅡ'],''],['数学','補強','偏差値40前後',{個別指導:10,AI学トレ:10,自立学習:10},'基本事項と弱点単元を重点的に補強します。',['パーソナル中3'],'私立推薦希望生徒推奨'],['数学','強化','偏差値50前後',{映像授業:10,個別指導:20},'標準〜入試問題まで段階的に演習します。',['夏期講座テキスト','テーマ別入試対策ⅠⅡ'],''],['理科','補強','偏差値40前後',{映像授業:12,AI学トレ:12,自立学習:12},'中1・中2範囲を中心に基礎を復習します。',['中1理科 年間用','中2理科 年間用'],''],['社会','強化','偏差値50前後',{映像授業:30,自立学習:10},'地理・歴史を中心に入試対策を進めます。',['社会年間用教材'],''],['国語','強化','偏差値50前後',{映像授業:10,AI学トレ:20,自立学習:10},'読解と知識を組み合わせて入試力を高めます。',['スピードチェック','テーマ別入試対策ⅠⅡ'],'']],R=[['英語','私立推薦対策','推薦入試受験者向け',{個別指導:8},'私立高校の過去問対応を行います。',['私立高校過去問（家庭購入）'],''],['数学','私立推薦対策','推薦入試受験者向け',{個別指導:8},'私立高校の過去問対応を行います。',['私立高校過去問（家庭購入）'],''],['国語','私立推薦対策','推薦入試受験者向け',{映像授業:3,AI学トレ:9,自立学習:8},'入試問題の解き方を総合的に演習します。',['テーマ別入試Ⅳ'],'']];let S='',E='',Q={};const y=n=>n.toLocaleString('ja-JP')+'円',r=c=>Object.values(c).reduce((a,b)=>a+b,0),c=x=>Object.entries(x).reduce((a,[k,v])=>a+U[k]*v,0),D=()=>S==='冬期'&&E==='推薦入試用'?R:G,C=()=>Object.values(Q).map(i=>D()[i]),N='教材費は別途になる場合があります。\n受講費は講座期間終了後、毎月の授業料と同時に請求します。\n条件により映像授業・AI学トレに正規料金が適用される場合があります。';document.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>{S=b.dataset.season;Q={};$('start').hidden=true;if(S==='冬期'){$('exam').hidden=false;$('status').textContent='冬期講座｜受験区分を選択'}else{E='一般受験用';go()}});document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>{E=b.dataset.exam;go()});$('examBack').onclick=()=>{$('exam').hidden=true;$('start').hidden=false;S='';E='';$('status').textContent='講座を選択してください'};$('workBack').onclick=()=>{$('work').hidden=true;Q={};if(S==='冬期'){$('exam').hidden=false}else{$('start').hidden=false;S='';E=''}};function go(){$('exam').hidden=true;$('work').hidden=false;$('mSeason').textContent=S+'講座';$('mExam').textContent=S==='冬期'?E:'一般受験用';$('status').textContent=S+'講座 '+(S==='冬期'?E:'');draw();preview()}function draw(){let d=D(),h='';O.forEach(s=>{let rows=d.map((x,i)=>({x,i})).filter(o=>o.x[0]===s);if(!rows.length)return;h+=`<div class=st>${s}</div>`;rows.forEach(({x,i})=>{let on=Q[s]===i;h+=`<button class="plan ${on?'sel':''}" data-i=${i}><div class=pt><span>${x[1]}</span><span>${on?'✓':''}</span></div><div class=bd><span class=tag>${x[2]}</span>${x[6]?`<span class="tag rec">${x[6]}</span>`:''}</div><div class=br>${Object.entries(x[3]).map(([k,v])=>k+' '+v+'回').join(' ／ ')}</div><div class=desc>${x[4]}</div><div class=price>${y(c(x[3]))}</div></button>`});});$('planList').innerHTML=h;document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,s=d[i][0];Q[s]===i?delete Q[s]:Q[s]=i;draw();preview()});summary()}function summary(){let a=C(),n=a.reduce((s,x)=>s+r(x[3]),0),p=a.reduce((s,x)=>s+c(x[3]),0);$('sNum').textContent=a.length+'件';$('sCount').textContent=n+'回';$('sHours').textContent=n+'時間';$('sPrice').textContent=y(p)}function preview(){let a=C(),n=a.reduce((s,x)=>s+r(x[3]),0),p=a.reduce((s,x)=>s+c(x[3]),0),w=S==='冬期';$('hero').className='hero '+(w?'winter':'summer');$('en').textContent=w?'Winter Course':'Summer Course';$('title').textContent=S+'講座 ご提案書';$('sub').textContent=w?'この冬を、合格への確かな力に。':'この夏、確かな一歩を。';$('pCount').textContent=n+'回';$('pHours').textContent=n+'時間';$('pPrice').textContent=y(p);$('note').textContent=N;$('courses').innerHTML=a.length?a.map(x=>`<article class=course><div class=chead><div><div class=sub>${x[0]}</div><div class=ct>${x[1]}</div></div><span class=lvl>${x[2]}</span></div><div class=cdesc>${x[4]}</div><div class=cbr>${Object.entries(x[3]).map(([k,v])=>k+' '+v+'回 × '+y(U[k])).join('<br>')}</div><div class=cp>${y(c(x[3]))}</div></article>`).join(''):'<div class=empty>左側からプランを選択すると、ここに提案内容が表示されます。</div>'}$('confirm').onclick=()=>{document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});toast('提案書を更新しました')};$('print').onclick=()=>window.print();$('openH').onclick=()=>{$('pview').classList.add('off');$('hview').classList.add('on');hand()};$('backP').onclick=()=>{$('hview').classList.remove('on');$('pview').classList.remove('off')};$('printH').onclick=()=>window.print();function hand(){$('hcards').innerHTML=C().map(x=>`<div class=hcard><b>${x[0]}｜${x[1]}</b><div class=desc>${x[4]}</div><div class=st>教材発注・確認</div>${x[5].map(m=>'<div class=check>□ '+m+'</div>').join('')}</div>`).join('')||'<div class=empty>選択されたプランがありません。</div>'}function toast(m){$('toast').textContent=m;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1200)}</script></body></html>
